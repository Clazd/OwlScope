name: Bug report
description: Report a reproducible problem without including private runtime data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste API keys, .env contents, persona data, prompts, run records, or private sources. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - Sandbox
        - Anthropic
        - DeepSeek-compatible endpoint
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant check output
      description: Redact secrets and personal data before pasting output.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, personal data, prompts, and private source content.
          required: true
